proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

set $auth_upstream http://auth-service:3003;
set $user_upstream http://user-service:3005;
set $catalog_upstream http://catalog-service:3006;
set $order_upstream http://order-service:3007;
set $payment_upstream http://payment-service:3008;
set $store_upstream http://store-service:3009;

location /auth {
  proxy_pass $auth_upstream;
}

location /graphql {
  proxy_pass $catalog_upstream;
}

location /me/orders {
  proxy_pass $order_upstream;
}

location /me/sales {
  proxy_pass $order_upstream;
}

location /me/store {
  proxy_pass $store_upstream;
}

location /me/stripe {
  proxy_pass $store_upstream;
}

location /me/keys {
  proxy_pass $store_upstream;
}

location /me {
  proxy_pass $user_upstream;
}

location /checkout {
  proxy_pass $order_upstream;
}

location /cart {
  proxy_pass $order_upstream;
}

location /config {
  proxy_pass $payment_upstream;
}

location /api/stripe {
  proxy_pass $payment_upstream;
}

location /api/admin/users {
  rewrite ^/api(.*)$ $1 break;
  proxy_pass $user_upstream;
}

location /api/admin/me {
  rewrite ^/api(.*)$ $1 break;
  proxy_pass $user_upstream;
}

location /api/admin/stats {
  rewrite ^/api(.*)$ $1 break;
  proxy_pass $user_upstream;
}

location /api/admin/audit {
  rewrite ^/api(.*)$ $1 break;
  proxy_pass $user_upstream;
}

location /api/admin/stores {
  rewrite ^/api(.*)$ $1 break;
  proxy_pass $store_upstream;
}

location /api/admin/orders {
  rewrite ^/api(.*)$ $1 break;
  proxy_pass $order_upstream;
}
