proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

set $auth_upstream http://auth-service:3003;
set $user_upstream http://user-service:3005;
set $books_upstream http://books-service:3006;
set $sales_upstream http://sales-service:3007;
set $payment_upstream http://payment-service:3008;
set $api_key_upstream http://api-key-service:3009;
set $cart_upstream http://cart-service:3010;

location /auth {
  proxy_pass $auth_upstream;
}

location /graphql {
  proxy_pass $books_upstream;
}

location /me/orders {
  proxy_pass $sales_upstream;
}

location /me/sales {
  proxy_pass $sales_upstream;
}

location /me/store {
  proxy_pass $books_upstream;
}

location /me/stripe {
  proxy_pass $books_upstream;
}

location /me/keys {
  proxy_pass $api_key_upstream;
}

location /me {
  proxy_pass $user_upstream;
}

location /checkout {
  proxy_pass $sales_upstream;
}

location /cart {
  proxy_pass $cart_upstream;
}

location /config {
  proxy_pass $payment_upstream;
}

location /api/stripe {
  proxy_pass $payment_upstream;
}

location /api/admin/users {
  rewrite ^/api(.*)$ $1 break;
  proxy_pass $user_upstream;
}

location /api/admin/me {
  rewrite ^/api(.*)$ $1 break;
  proxy_pass $user_upstream;
}

location /api/admin/stats {
  rewrite ^/api(.*)$ $1 break;
  proxy_pass $user_upstream;
}

location /api/admin/audit {
  rewrite ^/api(.*)$ $1 break;
  proxy_pass $user_upstream;
}

location /api/admin/stores {
  rewrite ^/api(.*)$ $1 break;
  proxy_pass $books_upstream;
}

location /api/admin/orders {
  rewrite ^/api(.*)$ $1 break;
  proxy_pass $sales_upstream;
}
