x-backend: &backend
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql://rwa:rwa@db:5432/rwa
    USER_SERVICE_URL: http://user-service:3005
    BOOKS_SERVICE_URL: http://books-service:3006
    SALES_SERVICE_URL: http://sales-service:3007
    PAYMENT_SERVICE_URL: http://payment-service:3008
    API_KEY_SERVICE_URL: http://api-key-service:3009
    UNLEASH_URL: http://unleash:4242/api/
    UNLEASH_API_TOKEN: default:development.unleash-insecure-api-token
    ELASTICSEARCH_URL: http://elasticsearch:9200
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    S3_ENDPOINT: http://minio:9000
    S3_REGION: us-east-1
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-rwa}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-rwaminio1}
    S3_BUCKET: rwa
    S3_FORCE_PATH_STYLE: "true"
  depends_on:
    db:
      condition: service_healthy
  init: true
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rwa
      POSTGRES_PASSWORD: rwa
      POSTGRES_DB: rwa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rwa -d rwa"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    <<: *backend
    profiles: ["backend", "auth-service"]
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
    image: rwa-auth-service:local
    ports:
      - "3003:3003"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 25s

  user-service:
    <<: *backend
    profiles: ["backend", "user-service"]
    build:
      context: .
      dockerfile: backend/user-service/Dockerfile
    image: rwa-user-service:local
    ports:
      - "3005:3005"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3005/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 25s

  books-service:
    <<: *backend
    profiles: ["backend", "books-service"]
    build:
      context: .
      dockerfile: backend/books-service/Dockerfile
    image: rwa-books-service:local
    ports:
      - "3006:3006"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3006/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 25s

  sales-service:
    <<: *backend
    profiles: ["backend", "sales-service"]
    build:
      context: .
      dockerfile: backend/sales-service/Dockerfile
    image: rwa-sales-service:local
    ports:
      - "3007:3007"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3007/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 25s

  payment-service:
    <<: *backend
    profiles: ["backend", "payment-service"]
    build:
      context: .
      dockerfile: backend/payment-service/Dockerfile
    image: rwa-payment-service:local
    ports:
      - "3008:3008"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3008/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 25s

  api-key-service:
    <<: *backend
    profiles: ["backend", "api-key-service"]
    build:
      context: .
      dockerfile: backend/api-key-service/Dockerfile
    image: rwa-api-key-service:local
    ports:
      - "3009:3009"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3009/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 25s

  # Feature flags UI + API. Tables live in schema `unleash` on the shared Postgres.
  unleash:
    image: unleashorg/unleash-server:latest
    profiles: ["backend", "unleash"]
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: postgresql://rwa:rwa@db:5432/rwa
      DATABASE_SCHEMA: unleash
      DATABASE_SSL: "false"
      DATABASE_SSL_REJECT_UNAUTHORIZED: "false"
      UNLEASH_URL: http://localhost:4242
      UNLEASH_FRONTEND_API_ORIGINS: "http://localhost:3000,http://localhost:3004"
      INIT_BACKEND_API_TOKENS: default:development.unleash-insecure-api-token
      INIT_FRONTEND_API_TOKENS: default:development.unleash-insecure-frontend-api-token
      CHECK_VERSION: "false"
      LOG_LEVEL: warn
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:4242/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    init: true
    restart: unless-stopped

  # Kong OSS (DB-less). Public API entry, JWT/API-key checks, rate limits. Off unless profile `gateway`.
  # Proxy: http://localhost:8080   Config: docker/kong/kong.yml
  kong:
    image: kong:3.9
    profiles: ["gateway", "kong"]
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_ADMIN_GUI_LISTEN: "off"
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_NGINX_HTTP_RESOLVER: 127.0.0.11 valid=30s ipv6=off
      KONG_TRUSTED_IPS: 0.0.0.0/0,::/0
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
      KONG_UNTRUSTED_LUA: "on"
      KONG_LOG_LEVEL: warn
    volumes:
      - ./docker/kong/kong.yml:/etc/kong/kong.yml:ro
      - ./docker/kong/access.lua:/etc/kong/access.lua:ro
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      books-service:
        condition: service_healthy
      sales-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      api-key-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    init: true
    restart: unless-stopped

  # OpenPanel (funnels / product analytics). Off unless profile `openpanel` is on.
  # Dashboard: http://localhost:3350  API (SDK): http://localhost:3350/api
  op-db:
    image: postgres:14-alpine
    profiles: ["openpanel"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - op-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  op-kv:
    image: redis:7.2.5-alpine
    profiles: ["openpanel"]
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    volumes:
      - op-kv-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  op-ch:
    image: clickhouse/clickhouse-server:25.10.2.65
    profiles: ["openpanel"]
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - op-ch-data:/var/lib/clickhouse
      - ./docker/openpanel/clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/op-config.xml:ro
      - ./docker/openpanel/clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/op-user-config.xml:ro
      - ./docker/openpanel/clickhouse/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  op-api:
    image: lindesvard/openpanel-api:2
    profiles: ["openpanel"]
    command:
      - sh
      - -c
      - CI=true pnpm -r run migrate:deploy && pnpm start
    environment: &openpanel-env
      NODE_ENV: production
      SELF_HOSTED: "true"
      BATCH_SIZE: "5000"
      BATCH_INTERVAL: "10000"
      ALLOW_REGISTRATION: "true"
      ALLOW_INVITATION: "true"
      REDIS_URL: redis://op-kv:6379
      CLICKHOUSE_URL: http://op-ch:8123/openpanel
      DATABASE_URL: postgresql://postgres:postgres@op-db:5432/postgres?schema=public
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@op-db:5432/postgres?schema=public
      DASHBOARD_URL: http://localhost:3350
      API_URL: http://localhost:3350/api
      COOKIE_SECRET: rwa-local-openpanel-cookie-secret
      EMAIL_SENDER: no-reply@localhost
    depends_on:
      op-db:
        condition: service_healthy
      op-kv:
        condition: service_healthy
      op-ch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  op-dashboard:
    image: lindesvard/openpanel-dashboard:2
    profiles: ["openpanel"]
    environment:
      <<: *openpanel-env
    depends_on:
      op-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  op-worker:
    image: lindesvard/openpanel-worker:2
    profiles: ["openpanel"]
    environment:
      <<: *openpanel-env
    depends_on:
      op-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  op-proxy:
    image: caddy:2-alpine
    profiles: ["openpanel"]
    ports:
      - "3350:80"
    volumes:
      - ./docker/openpanel/Caddyfile:/etc/caddy/Caddyfile:ro
      - op-proxy-data:/data
      - op-proxy-config:/config
    depends_on:
      op-api:
        condition: service_healthy
      op-dashboard:
        condition: service_healthy
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    profiles: ["elasticsearch"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      cluster.name: rwa
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.4
    profiles: ["elasticsearch"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.4
    profiles: ["elasticsearch"]
    user: root
    command: filebeat -e -strict.perms=false
    volumes:
      - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # OpenTelemetry → Jaeger + Prometheus + Grafana. Off unless profile `observability`.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.122.1
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://127.0.0.1:16686/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3001:3000"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
    restart: unless-stopped

  # S3-compatible object storage. Console is HTTP (:9001); browser GET is HTTPS via nginx /media/.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rwa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rwaminio1}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rwa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rwaminio1}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p local/rwa
        mc anonymous set download local/rwa
        echo "ok" | mc pipe local/rwa/health.txt
        echo "MinIO bucket rwa is ready"
    restart: "no"

  # Public + admin UIs (Vite build + nginx TLS). Started by `make up`.
  # https://localhost:3000  and  https://localhost:3004
  frontend:
    profiles: ["frontend", "web", "nginx"]
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_UNLEASH_URL: ${VITE_UNLEASH_URL:-http://localhost:4242/api/frontend}
        VITE_UNLEASH_CLIENT_KEY: ${VITE_UNLEASH_CLIENT_KEY:-}
        VITE_OPENPANEL_API_URL: ${VITE_OPENPANEL_API_URL:-http://localhost:3350/api}
        VITE_OPENPANEL_ENABLED: ${VITE_OPENPANEL_ENABLED:-}
        VITE_OPENPANEL_CLIENT_ID: ${VITE_OPENPANEL_CLIENT_ID:-}
    image: rwa-frontend:local
    env_file:
      - .env
    environment:
      NGINX_GATEWAY: ${NGINX_GATEWAY:-}
    ports:
      - "3000:3000"
      - "3004:3004"
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fk https://127.0.0.1:3000/healthz && curl -fk https://127.0.0.1:3004/healthz",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 25s
    restart: unless-stopped

volumes:
  pgdata:
  op-db-data:
  op-kv-data:
  op-ch-data:
  op-proxy-data:
  op-proxy-config:
  esdata:
  prometheus-data:
  grafana-data:
  minio-data:
